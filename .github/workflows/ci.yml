name: NadaVerse Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web-checks:
    name: Web Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: ESLint Code Quality
        working-directory: web
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: web
        run: npx tsc --noEmit

      - name: Synthetic Pitch Estimator Tests
        working-directory: web
        run: npx tsx scripts/test-pitch.mjs

      - name: Composition Schema & Rhythmic Integrity Tests
        working-directory: web
        run: npx tsx scripts/test-compositions-schema.mjs

      - name: Service Worker Privacy Tests
        working-directory: web
        run: npx tsx scripts/test-sw-privacy.mjs

      - name: Next.js Production Build
        working-directory: web
        run: npm run build

  backend-checks:
    name: Backend API & AI Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Single Head
        working-directory: backend
        run: python -m alembic heads

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v
